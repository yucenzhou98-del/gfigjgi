<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運物展示 - 招財幸運貓</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ 招財幸運貓 ✨</h1>
            <p class="subtitle">帶來好運、財富與祝福的守護者</p>
        </header>

        <main>
            <!-- 幸運物視覺展示區 -->
            <section class="card-section">
                <div class="lucky-card" id="luckyCatCard">
                    <div class="cat-avatar">🐱🐾</div>
                    <div class="glow-effect"></div>
                </div>
                <p class="interactive-hint">💡 提示：將滑鼠懸停於幸運貓上或點擊牠，看看會發生什麼事！</p>
            </section>

            <!-- 主題故事與由來 -->
            <section class="story-section">
                <h2>📜 幸運貓的由來與象徵</h2>
                <div class="content-box">
                    <h3>起源故事</h3>
                    <p>招財幸運貓（招き猫）源自日本傳統文化。傳說中，有位武士在雷雨天路過寺廟，看到一隻貓向他招手。當他走進寺廟時，原本站立的地方立刻被落雷擊中。貓咪的招手動作拯救了他的生命，從此貓咪便被視為能夠辟邪降福的幸運象徵。</p>
                </div>
                
                <div class="content-box">
                    <h3>象徵意涵</h3>
                    <ul>
                        <li><strong>舉右手：</strong> 象徵招財進寶、財運亨通。</li>
                        <li><strong>舉左手：</strong> 象徵千客萬來、廣結善緣。</li>
                        <li><strong>金色與白色：</strong> 代表開運、吉祥與純潔的祝福。</li>
                    </ul>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 幸運物動態網頁專案</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
